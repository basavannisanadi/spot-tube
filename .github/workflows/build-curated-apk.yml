name: Build Curated APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Dev Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Dev Debug APK
        run: ./gradlew :app:assembleDevDebug --no-daemon

      - name: Upload Curated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-curated-debug-apk
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
